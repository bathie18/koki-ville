<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espace agents — Commune de Coki</title>
<meta name="description" content="Espace de démonstration pour les agents de la mairie : demandes, signalements, paiements.">
<meta name="theme-color" content="#0b5d3b">
<link rel="icon" href="assets/img/logo-commune.png">
<link rel="preload" href="assets/fonts/manrope-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="agent">
<main id="contenu">
<section class="page-tete"><div class="wrap"><nav class="ariane" aria-label="Fil d'Ariane"><a href="index.html">Accueil</a> › Espace agents</nav><h1>Espace agents</h1><p>Tableau de bord des demandes en ligne, des signalements et des paiements : ce que verraient les services de la mairie.</p></div></section>
<section class="section"><div class="wrap" style="display:grid;gap:22px">
  <div class="bandeau-demo">Certaines données sont fictives.</div>
  <div class="chiffres" id="kpi"></div>
  <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center">
    <div class="onglets" role="tablist">
      <button type="button" role="tab" data-vue="demandes">Demandes</button>
      <button type="button" role="tab" data-vue="signalements">Signalements</button>
      <button type="button" role="tab" data-vue="paiements">Paiements</button>
      <button type="button" role="tab" data-vue="messages">Messages</button>
    </div>
    <label style="font-weight:700;display:flex;gap:8px;align-items:center">Statut
      <select id="filtre-statut" style="font:600 .95rem var(--texte);padding:8px 10px;border-radius:10px;border:2px solid var(--ligne)"><option value="">Tous</option><option value="recu">Reçu</option><option value="instruction">En cours de traitement</option><option value="pret">Traité</option></select></label>
  </div>
  <div id="zone-carte" hidden><div id="carte-agent" class="carte-map" role="region" aria-label="Carte des signalements"></div>
    <p class="legende" style="margin-top:10px"><span><i style="background:#c8402f"></i>Reçu</span><span><i style="background:#d89a14"></i>En cours</span><span><i style="background:#0b5d3b"></i>Traité</span></p></div>
  <div class="table-zone" id="tableau"></div>
  <div><button class="btn btn-ligne" type="button" id="reinit"><i data-lucide="trash-2"></i>Réinitialiser la démonstration</button></div>
</div></section>
</main>
<script src="config.js"></script>
<script src="data/demarches.js"></script>
<script src="data/actualites.js"></script>
<script src="data/limite.js"></script>
<script src="data/formulaires.js"></script>
<script src="assets/vendor/leaflet/leaflet.js"></script>
<script src="assets/vendor/lucide.min.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/formulaires.js"></script>
<script src="assets/js/pages.js"></script>
</body>
</html>
